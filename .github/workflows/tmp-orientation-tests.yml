name: Temporary orientation tests

on:
  push:
    branches:
      - fix/polymarket-us-price-orientation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_polymarket_us.py'
      - run: python -m unittest discover -s tests -p 'test_international_mapping.py'
